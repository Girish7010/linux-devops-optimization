name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          for f in install.sh scripts/*.sh; do
            bash -n "$f" && echo "OK  $f"
          done

      - name: ShellCheck
        run: shellcheck -S warning install.sh scripts/*.sh

      - name: Validate JSON configs
        run: python3 -m json.tool configs/docker/daemon.json > /dev/null

      - name: Installer dry-run
        run: sudo ./install.sh --dry-run
