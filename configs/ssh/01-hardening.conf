# SSH hardening drop-in. Installed to /etc/ssh/sshd_config.d/01-hardening.conf
# Named "01-" on purpose: sshd uses the FIRST value it reads, so this wins over
# cloud-init's 50-cloud-init.conf (which often sets PasswordAuthentication yes).
#
# !! Before enabling: make sure you can log in with an SSH KEY as a sudo user. !!
# install.sh only applies this with --with-ssh-hardening and validates with `sshd -t` first.

PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
MaxAuthTries 3
MaxSessions 10
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
