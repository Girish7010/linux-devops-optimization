# Installed to /etc/security/limits.d/99-nofile.conf
# Applies to login sessions (SSH, su). Services started by systemd ignore this file -
# set LimitNOFILE=100000 in the unit (systemctl edit <service>) for those.
*     soft  nofile  100000
*     hard  nofile  100000
root  soft  nofile  100000
root  hard  nofile  100000
