# Linux performance + network hardening for app / Docker servers.
# Installed to /etc/sysctl.d/99-devops-tuning.conf and applied with: sudo sysctl --system
# Using a drop-in file (instead of appending to /etc/sysctl.conf) keeps it idempotent
# and easy to roll back: just delete the file and run sysctl --system.

# ---------- Memory ----------
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15

# ---------- File handles ----------
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# ---------- Network performance ----------
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_slow_start_after_idle = 0

# ---------- Network hardening ----------
net.ipv4.tcp_syncookies = 1
# 2 = loose mode, safe with Docker / multiple interfaces
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# ---------- Kernel hardening ----------
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2

# NOTE: net.ipv4.ip_forward is intentionally NOT set here - Docker/Kubernetes manage it.
